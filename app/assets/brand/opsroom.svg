<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cutout mask to cleanly remove the top & bottom gaps from the circle -->
    <mask id="gap-mask">
      <rect width="512" height="512" fill="white" />
      <!-- Top gap -->
      <rect x="220" y="0" width="72" height="80" fill="black" />
      <!-- Bottom gap -->
      <rect x="220" y="432" width="72" height="80" fill="black" />
    </mask>
  </defs>

  <g fill="none">
    <!-- Perfect Outer Circle with exact top/bottom cutouts -->
    <circle cx="256" cy="256" r="180" stroke="#FFFFFF" stroke-width="12" mask="url(#gap-mask)" />

    <!-- Top Dashed Runway / Navigation Line -->
    <line x1="256" y1="48" x2="256" y2="160" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="16 14" stroke-linecap="butt" />

    <!-- Left Half of Center Arrow -->
    <polygon points="256,198 162,376 254,326" fill="#FFFFFF" />
    
    <!-- Right Half of Center Arrow (Separate polygon for clean center seam) -->
    <polygon points="256,198 350,376 258,326" fill="#FFFFFF" />
  </g>
</svg>
